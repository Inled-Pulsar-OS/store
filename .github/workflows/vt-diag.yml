name: "VT Diagnostic (temp - EICAR)"
on: workflow_dispatch

jobs:
  vt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Consultar hash EICAR.zip original de la pipeline
        run: |
          HASH="7c2e26f622ee253a52a0a129eaa964a8c5adb4d4dc7dfb74b4023ffdda0366ed"
          CODE=$(curl -s -o /tmp/existing.json -w "%{http_code}" -H "x-apikey: ${{ secrets.VT_API_KEY }}" "https://www.virustotal.com/api/v3/files/${HASH}")
          echo "HTTP $CODE"
          python3 - <<'PYEOF'
          import json
          d = json.load(open('/tmp/existing.json'))
          if 'error' in d:
              print("RESULTADO_ORIGINAL:", d['error'].get('code') or d['error'].get('message'))
          else:
              a = (d.get('data') or {}).get('attributes') or {}
              print("RESULTADO_ORIGINAL stats:", a.get('last_analysis_stats'))
              print("RESULTADO_ORIGINAL last_analysis_date:", a.get('last_analysis_date'))
          PYEOF
      - name: Escanear eicar-com.zip hasta que VT termine
        run: |
          python3 - <<'PYEOF'
          import json, os, time, hashlib, urllib.request
          KEY = os.environ.get('MY_KEY','')
          blob = open('eicar-com.zip','rb').read()
          print("sha256 del zip:", hashlib.sha256(blob).hexdigest())
          def call(url, data=None):
              headers = {'x-apikey': KEY, 'Content-Type':'application/octet-stream'} if data else {'x-apikey': KEY}
              req = urllib.request.Request(url, data=data, headers=headers, method='POST' if data else 'GET')
              with urllib.request.urlopen(req, timeout=90) as r:
                  return json.load(r)
          d = call('https://www.virustotal.com/api/v3/files', data=blob)
          aid = d.get('data',{}).get('id')
          print("Analysis ID:", aid)
          done = False
          for i in range(90):
              time.sleep(10)
              a = call(f'https://www.virustotal.com/api/v3/analyses/{aid}')
              att = (a.get('data') or {}).get('attributes') or {}
              print(f"poll {i+1}:", att.get('status'), att.get('stats'))
              if att.get('status') == 'completed':
                  done = True
                  break
          print("DONE:", done)
          PYEOF
        env:
          MY_KEY: ${{ secrets.VT_API_KEY }}
name: "📦 Submit Flatpak Desktop App"
description: "Register or index a Flatpak desktop application for Pulsar OS"
title: "[App]: "
labels: ["app", "flatpak", "submission"]
body:
  - type: markdown
    attributes:
      value: |
        ### 📦 Flatpak Application Submission
        Index your Flatpak application or Flathub container reference.
  - type: input
    id: id
    attributes:
      label: "Flatpak Application ID"
      description: "Reverse-DNS format application identifier"
      placeholder: "com.brave.Browser"
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: "Application Name"
      placeholder: "Brave Web Browser"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Description"
      placeholder: "Describe the application functionality and features..."
    validations:
      required: true
  - type: input
    id: zip_url
    attributes:
      label: "Flatpakref URL or Download Link"
      description: "Official .flatpakref link from Flathub or direct container repository"
      placeholder: "https://dl.flathub.org/repo/appstream/com.brave.Browser.flatpakref"
    validations:
      required: true
  - type: textarea
    id: icon_url
    attributes:
      label: "Application Icon (PNG or SVG)"
      description: "Drag and drop the app icon image."
      placeholder: "Drag and drop icon image here..."
    validations:
      required: true
  - type: input
    id: promo_url
    attributes:
      label: "Official Website (Optional)"
      placeholder: "https://brave.com"
  - type: input
    id: github_url
    attributes:
      label: "Source Repository (Optional)"
      placeholder: "https://github.com/flathub/com.brave.Browser"

name: "🧠 Submit Sayri Skill"
description: "Submit an autonomous AI skill or subagent bundle for Sayri AI on Pulsar OS"
title: "[Skill]: "
labels: ["skill", "sayri", "submission"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🧠 Sayri AI Skill Submission
        Submit your Sayri skill package with `SKILL.md` declaration and isolated execution adapters.
  - type: input
    id: id
    attributes:
      label: "Skill ID"
      description: "Unique skill identifier starting with sayri-skill-"
      placeholder: "sayri-skill-discord-support"
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: "Skill Name"
      placeholder: "Discord Voice & Support Agent"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Skill Description"
      placeholder: "Explain what this subagent or skill provides to Sayri..."
    validations:
      required: true
  - type: dropdown
    id: sandbox_level
    attributes:
      label: "Declared Sandbox Isolation Level"
      description: "Security boundary level for execution"
      options:
        - "LEVEL_0_NO_EXEC (Isolated / No host execution)"
        - "LEVEL_1_READ_ONLY (Read-only sandbox)"
        - "LEVEL_2_STRICT_BWRAP (Bubblewrap filesystem container)"
        - "LEVEL_3_FULL_HOST (Full Host Access with explicit user confirmation)"
    validations:
      required: true
  - type: textarea
    id: zip_url
    attributes:
      label: "Skill ZIP Archive"
      description: "Drag and drop or upload your packaged skill .zip archive containing SKILL.md and tools."
      placeholder: "Drag and drop your skill .zip archive here..."
    validations:
      required: true
  - type: textarea
    id: icon_url
    attributes:
      label: "Skill Icon (PNG or SVG)"
      description: "Drag and drop a square PNG or SVG icon."
      placeholder: "Drag and drop your icon here..."
    validations:
      required: true
  - type: input
    id: github_url
    attributes:
      label: "Source Repository (Optional)"
      placeholder: "https://github.com/author/sayri-skill-custom"
  - type: textarea
    id: demo_urls
    attributes:
      label: "Demo Screenshots or Videos (Optional)"
      placeholder: "Drag and drop demo screenshots here..."
  - type: markdown
    attributes:
      value: |
        ---
        ### ⚙️ OpenCode Audit Pipeline Configuration (Optional)
  - type: dropdown
    id: ai_provider
    attributes:
      label: "AI Audit Provider"
      options:
        - "Default (Repository Groq Llama 3.3 70B)"
        - "Groq"
        - "OpenAI"
        - "OpenRouter"
        - "DeepSeek"
        - "Anthropic"
  - type: input
    id: ai_api_key
    attributes:
      label: "Custom Provider API Key (Optional)"
      placeholder: "gsk_... / sk-..."
  - type: input
    id: ai_model
    attributes:
      label: "Custom AI Model Name (Optional)"
      placeholder: "llama-3.3-70b-versatile"

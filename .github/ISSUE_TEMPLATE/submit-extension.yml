name: "🧩 Submit GNOME Extension"
description: "Submit a GNOME Shell extension package for automated OpenCode and VirusTotal security verification"
title: "[Extension]: "
labels: ["extension", "gnome", "submission"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🧩 GNOME Shell Extension Submission
        Please upload your packaged extension `.zip` archive containing `metadata.json` and `extension.js`.
  - type: input
    id: id
    attributes:
      label: "Extension UUID"
      description: "Official extension UUID declared in metadata.json"
      placeholder: "my-extension@pulsar.org"
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: "Extension Name"
      placeholder: "Transparent Top Bar"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Description"
      placeholder: "Describe the functionality and features of your extension..."
    validations:
      required: true
  - type: input
    id: github_url
    attributes:
      label: "GitHub Repository (Optional)"
      placeholder: "https://github.com/author/my-extension"
  - type: textarea
    id: zip_url
    attributes:
      label: "Extension ZIP Archive"
      description: "Drag and drop or upload your packaged .zip file directly into this box (GitHub will generate the file attachment link)."
      placeholder: "Drag and drop your .zip archive here..."
    validations:
      required: true
  - type: textarea
    id: icon_url
    attributes:
      label: "Extension Icon (PNG or SVG)"
      description: "Drag and drop a square PNG or SVG icon image (recommended 128x128 or larger)."
      placeholder: "Drag and drop your icon image here..."
    validations:
      required: true
  - type: textarea
    id: demo_urls
    attributes:
      label: "Screenshots & Demo Images (Optional)"
      description: "Drag and drop preview screenshots or GIFs."
      placeholder: "Drag and drop preview screenshots here..."
  - type: markdown
    attributes:
      value: |
        ---
        ### ⚙️ OpenCode Audit Pipeline Configuration (Optional)
  - type: dropdown
    id: ai_provider
    attributes:
      label: "AI Audit Provider"
      options:
        - "Default (Repository Groq Llama 3.3 70B)"
        - "Groq"
        - "OpenAI"
        - "OpenRouter"
        - "DeepSeek"
        - "Anthropic"
  - type: input
    id: ai_api_key
    attributes:
      label: "Custom Provider API Key (Optional)"
      placeholder: "gsk_... / sk-..."
  - type: input
    id: ai_model
    attributes:
      label: "Custom AI Model Name (Optional)"
      placeholder: "llama-3.3-70b-versatile"

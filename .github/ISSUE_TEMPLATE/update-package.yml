name: "🔄 Update Package Version"
description: "Publish a new version for an existing application, extension, or skill"
title: "update: "
labels: ["update", "version-bump"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🔄 Update Package Version
        Submit a new release version for an existing package in Pulsar Store.
        
        * **Desktop Applications**: Provide Flatpak (`.flatpak` binary bundle or `.flatpakref` URL) **OR** dual native packages (`.deb` AND `.pkg.tar.zst`). Generic `.zip` source files are rejected for apps.
        * **Skills & Extensions**: Provide the updated `.zip` package archive.
  - type: input
    id: id
    attributes:
      label: "Package ID"
      placeholder: "sayri-skill-web-search or com.example.app"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "New Version Number"
      placeholder: "1.1.0"
    validations:
      required: true
  - type: textarea
    id: zip_url
    attributes:
      label: "New Release Binary / Package Asset URL"
      description: "Direct download link or drag-and-drop (.flatpak, .deb / .pkg.tar.zst, or .zip for skills/extensions)."
      placeholder: "https://github.com/org/repo/releases/download/... or drag-and-drop"
    validations:
      required: true
  - type: textarea
    id: changelog
    attributes:
      label: "Changelog / Release Notes"
      placeholder: "Summary of bugfixes, changes, and new features..."

name: "🔄 Update Package Version"
description: "Publish a new version for an existing application, extension, or skill"
title: "update: "
labels: ["update", "version-bump"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🔄 Update Package Version
        Submit a new release version for an existing package.
  - type: input
    id: id
    attributes:
      label: "Package ID"
      placeholder: "sayri-skill-web-search"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "New Version Number"
      placeholder: "1.3.0"
    validations:
      required: true
  - type: textarea
    id: zip_url
    attributes:
      label: "New Release ZIP Archive"
      description: "Drag and drop the updated package .zip file."
      placeholder: "Drag and drop your updated .zip here..."
    validations:
      required: true
  - type: textarea
    id: changelog
    attributes:
      label: "Changelog / Release Notes"
      placeholder: "Summary of bugfixes, changes, and new features..."

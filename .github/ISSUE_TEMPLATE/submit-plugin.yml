name: "🔌 Submit Gateway or Plugin"
description: "Submit a Sayri channel gateway (Discord, Matrix, Telegram) or system plugin"
title: "[Plugin]: "
labels: ["plugin", "gateway", "submission"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🔌 Gateway / Plugin Submission
        Submit your channel gateway adapter or system plugin.
  - type: input
    id: id
    attributes:
      label: "Plugin ID"
      placeholder: "sayri-gateway-telegram"
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: "Plugin Name"
      placeholder: "Telegram Channel Gateway"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Plugin Description"
      placeholder: "Explain what channel or protocol this gateway connects to..."
    validations:
      required: true
  - type: textarea
    id: zip_url
    attributes:
      label: "Plugin ZIP Archive"
      description: "Drag and drop or upload your packaged .zip file."
      placeholder: "Drag and drop your .zip file here..."
    validations:
      required: true
  - type: textarea
    id: icon_url
    attributes:
      label: "Plugin Icon (PNG or SVG)"
      placeholder: "Drag and drop your icon here..."
    validations:
      required: true
  - type: input
    id: github_url
    attributes:
      label: "Source Repository (Optional)"
      placeholder: "https://github.com/author/gateway-plugin"

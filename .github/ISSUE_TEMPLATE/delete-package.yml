name: "🗑️ Request Package Deletion"
description: "Request deprecation or removal of a package from the catalog (Owner/Admin only)"
title: "delete: "
labels: ["removal", "admin"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🗑️ Request Package Deletion
        Request removal of a package from the Pulsar Store index.
  - type: input
    id: id
    attributes:
      label: "Package ID to Remove"
      placeholder: "package-id"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: "Reason for Deletion"
      placeholder: "Explain the reason for removal..."
    validations:
      required: true
